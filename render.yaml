# Render — the free option, for testing the idea at low traffic.
#
# The free plan spins the service down after ~15 minutes idle, so the first
# request after a quiet period takes roughly 50 seconds. That is survivable
# while validating demand and not survivable once anyone depends on it; move
# to a paid instance (or Fly) at that point. Nothing else changes.
#
# Region: Singapore, matching the Supabase project (ap-southeast-1), so
# database round-trips inside a workflow run stay in-region.

services:
  # ---------------------------------------------------------------------------
  # Web app — a static bundle, served from the same origin as the API.
  # ---------------------------------------------------------------------------
  # The /api rewrite is the point of hosting both halves here. Same origin means
  # no CORS, no cross-origin auth headers, and no API_BASE to configure per
  # environment — three pieces of configuration that existed only because the
  # two halves lived on different domains.
  - type: web
    name: finance-workflows-web
    runtime: static
    buildCommand: npm install --prefix ./web && npm run build --prefix ./web
    staticPublishPath: ./web/build
    pullRequestPreviewsEnabled: false
    routes:
      # Order matters: the API rewrite must come before the SPA catch-all, or
      # every API call would be answered with index.html.
      - type: rewrite
        source: /api/*
        destination: https://finance-workflows-worker.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ---------------------------------------------------------------------------
  # Worker — runs the workflows. Needs a live process, not a function.
  # ---------------------------------------------------------------------------
  - type: web
    name: finance-workflows-worker
    runtime: docker
    # Both paths are relative to the repository root, which is the only place
    # Render looks for this file. The worker lives in a subdirectory, so they
    # are spelled out rather than relying on rootDir.
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      # Set every one of these in the Render dashboard, not here. Secrets in a
      # committed file are how they end up in a git history for ever.
      - key: FW_ENV
        value: production          # never "dev": that enables the dev principal
      - key: FW_DATABASE_URL
        sync: false                # Supabase Postgres connection string
      - key: FW_ENCRYPTION_KEY
        sync: false                # Fernet key; rotating it orphans stored tokens
      - key: FW_XERO_CLIENT_ID
        sync: false
      - key: FW_XERO_CLIENT_SECRET
        sync: false
      - key: FW_XERO_REDIRECT_URI
        sync: false                # https://<this-service>.onrender.com/api/connections/xero/callback
      # Where every OAuth callback sends the browser once consent is done, and
      # the single allowed CORS origin. It pointed at the old Vercel host long
      # after the web app moved here, so a successful Xero or Gmail connection
      # ended on a 404 and looked like a failed one. It must be the host that
      # actually serves the app.
      - key: FW_WEB_ORIGIN
        value: https://finance-workflows-web.onrender.com
      - key: SUPABASE_URL
        sync: false                # enables real JWT verification

      # --- Invoice Inbox -------------------------------------------------
      # Gmail. Mailboxes are connected with read + compose scopes and never
      # gmail.send, so the service cannot send an email even if the code
      # tried to. gmail.readonly is a Google *restricted* scope: production
      # use needs OAuth verification plus a third-party CASA assessment, so
      # test mode (up to 100 test users) is the ceiling until that clears.
      - key: FW_GOOGLE_CLIENT_ID
        sync: false
      - key: FW_GOOGLE_CLIENT_SECRET
        sync: false
      - key: FW_GOOGLE_REDIRECT_URI
        sync: false                # https://<this-service>.onrender.com/api/connections/google/callback

      # Classification. Without this key the inbox still ingests and still
      # drafts from approved templates — every email simply arrives
      # unclassified for a person to categorise, which is the same degraded
      # mode a model outage produces. No part of correctness depends on it.
      - key: FW_GEMINI_API_KEY
        sync: false
      - key: FW_GEMINI_MODEL
        value: gemini-2.5-flash
